events {}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index homepage.html;

    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    location /css/ {
      alias /usr/share/nginx/html/css/;
    }

    location /javascript/ {
      alias /usr/share/nginx/html/javascript/;
    }

    location /pictures/ {
      alias /usr/share/nginx/html/pictures/;
    }

    # ✅ Proxy các request tới Flask backend
    location /admin/ {
      proxy_pass http://backend_api:5000;  # tên service backend trong Docker Compose
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Cho phép chuyển cookie về frontend
      proxy_cookie_path / "/; SameSite=Lax";
    }
  }
}
